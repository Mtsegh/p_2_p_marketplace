name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "4000"
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      TEST_DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  client:
    name: Client
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      TEST_DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      NEXT_PUBLIC_API_URL: http://localhost:4000
      E2E_API_URL: http://localhost:4000
      E2E_CLIENT_URL: http://localhost:3000
      E2E_WEBHOOK_SECRET: e2e-webhook-secret-change-me
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Apply migrations to the test database
        run: npm run db:deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
        working-directory: client
      - name: Run browser E2E suite
        run: npm run test:e2e
        working-directory: client
